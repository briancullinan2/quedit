<!DOCTYPE html>
<html>
<head>
    <title>Quake 3 Editor</title>
    <link href='/boxicons.min.css' rel='stylesheet'>
    <link href="/main.css" rel="stylesheet" />
    <link href="/xterm.css" rel="stylesheet" />
    <link href="/theme.css" rel="stylesheet" />

</head>
<body class="monokai">
    <div id="main" class="panel-column">
        <div id="toolbar">
            <ul>
                <li><select name="owner" id="owner">
                    <option value="briancullinan2">briancullinan2</option>
                    <option value="ec-">ec-</option>
                </select></li>
                <li><select name="repository" id="repository">
                    <option value="Quake3e">Quake3e</option>
                </select></li>
                <li><select name="branch" id="branch">
                    <option value="main">main</option>
                </select></li>
                <li><a alt="Save file" href="#save" class="bx bx-save"></a></li>
                <li><a alt="Upload file" href="#upload" class="bx bx-folder-up-arrow"></a></li>
                <li><a alt="Undo" href="#undo" class="bx bx-undo"></a></li>
                <li><a alt="Redo" href="#redo" class="bx bx-redo"></a></li>
                <li><select name="filename" id="filename">
                    <option value="">Current filename</option>
                </select></li>
                <li><a alt="Compile" href="#code" class="bx bx-code"></a></li>
                <li><a alt="Run" href="#play" class="bx bx-play"></a></li>
                <li><a alt="Pause" href="#pause" class="bx bx-pause"></a></li>
                <li><a alt="Stop" href="#stop" class="bx bx-stop"></a></li>
                <li><a alt="Reload" href="#reload" class="bx bx-refresh-cw-alt"></a></li>
                <li><a alt="Console" href="#console" class="bx bx-terminal"></a></li>
                <li><select name="spawn" id="spawn">
                    <option value="">Spawn point</option>
                </select></li>
                <li><select name="map" id="map">
                    <option value="">Current map</option>
                </select></li>
                <li><select name="wasi" id="wasi">
                    <option value="">WASI-SDK v33 (Not downloaded)</option>
                </select></li>
                <li><select name="theme" id="theme">
                    <option value="">Monokai</option>
                </select></li>
                <li><a onclick="updatePlaceholder()" alt="Github login" class="bx bx-arrow-in-right-square-half" target="_new" href="https://github.com/settings/tokens?type=beta"></a></li>
            </ul>
        </div>
        <div id="main-body" class="panel-row">
            <div id="tabs">
                <ul>
                    <li><a alt="Search files" href="#filesearch" class="bx bx-search"></a></li>
                    <li><a alt="Engine files" href="#filelist" class="bx bx-folder-code"></a></li>
                    <li><a alt="Game files" href="#gamelist" class="bx bx-handheld-alt"></a></li>
                    <li><a alt="Assets" href="#assetlist" class="bx bx-treasure-chest"></a></li>
                    <li><a alt="Local database" href="#database" class="bx bx-database"></a></li>
                </ul>
            </div>
            <div id="editor-container" class="panel-row">
                <div id="filesearch">

                </div>
                <div id="filelist">

                </div>
                <div id="gamelist">

                </div>
                <div id="assetlist">

                </div>
                <div id="database">

                </div>
<div id="editor">
#include <stdio.h>

int main() {
    printf("Hello World!\n");
    printf("WASI Compiler Check: SUCCESS\n");
    return 0;
}

</div>
            </div>
            <div id="engine">

            </div>
        </div>
        <div id="terminal">

        </div>
        <div id="statusbar">
            <span>Status: </span>
            <span>No engine</span>
        </div>
    </div>

    <div id="token-modal" class="hidden">
        <div class="modal-content">
            <h3>GitHub Access Token</h3>
            <p>Required for API access</p>
            <input type="password" id="gh-token-input" />
            <div class="actions">
                <button onclick="saveToken()">Save Token</button>
                <button onclick="clearToken()" class="danger">Clear</button>
            </div>
        </div>
    </div>

    <script src="/ace/ace.js" type="text/javascript" charset="utf-8" defer></script>
    <script src="/xterm.js" type="text/javascript" defer></script>
    <script src="/tree.js" type="text/javascript" defer></script>
    <script src="/index.js" type="text/javascript" defer></script>
</body>
</html>

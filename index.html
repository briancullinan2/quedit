<!DOCTYPE html>
<html>

<head>
    <title>Quake 3 Editor</title>
    <link href='/boxicons.min.css' rel='stylesheet'>
    <link href="/main.css" rel="stylesheet" />
    <link href="/xterm.css" rel="stylesheet" />
    <link href="/theme.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/quakejs-bnw.png">
    <script type="text/javascript">
        if (typeof window.preFS == 'undefined') window.preFS = {};
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="theme-monokai">
    <div id="main" class="panel-column">
        <div id="toolbar">
            <ul>
                <li class="setting">
                    <ul>
                        <li><a onclick="updatePlaceholder()" alt="Github login" class="bx bx-arrow-in-right-square-half"
                                target="_new" href="https://github.com/settings/tokens?type=beta"></a></li>
                        <li class="setting" placeholder="Repository owner">
                            <select required name="owner" id="owner">
                                <option value="" selected disabled>Repository owner</option>
                                <option value="briancullinan2">briancullinan2</option>
                                <option value="ec-">ec-</option>
                            </select></li>
                        <li class="setting" placeholder="Current repository">
                            <select required name="repository" id="repository">
                                <option value="" selected disabled>Current repository</option>
                                <option value="Quake3e">Quake3e</option>
                                <option value="baseq3a">baseq3a</option>
                            </select></li>
                        <li class="setting" placeholder="Current branch">
                            <select required name="branch" id="branch">
                                <option value="" selected disabled>Current branch</option>
                                <option value="main">main</option>
                            </select></li>
                    </ul>
                </li>
                <li>
                    <ul>
                        <li>
                            <a alt="New file" href="#new" class="bx bx-file-plus"></a>
                        </li>
                        <li><a alt="Save file" href="#save" class="bx bx-save"></a></li>
                        <li><a alt="Upload file" href="#upload" class="bx bx-folder-up-arrow"></a></li>
                        <li><a alt="Back" href="#back" class="bx bx-undo"></a></li>
                        <li><a alt="Next" href="#next" class="bx bx-redo"></a></li>
                    </ul>
                </li>
                <li style="min-width: 200px;" placeholder="Current filename">
                    <select required name="filename" id="filename">
                        <option value="" selected disabled>Current filename</option>
                        <option value="">Current filename</option>
                    </select>
                </li>
                <li>
                    <ul>
                        <li>
                            <a alt="Compile" href="#compile" class="bx bx-code"></a>
                        </li>
                        <li><a alt="Run" href="#play" class="bx bx-play"></a></li>
                        <li><a alt="Pause" href="#pause" class="bx bx-pause"></a></li>
                        <li><a alt="Stop" href="#stop" class="bx bx-stop"></a></li>
                        <li><a alt="Reload" href="#reload" class="bx bx-refresh-cw-alt"></a></li>
                    </ul>
                </li>
                <li class="setting" placeholder="Key binding">
                    <select required name="keybinding" id="keybinding">
                        <option value="" selected disabled>Key binding</option>
                        <option value="null">Ace</option>
                        <option value="ace/keybinding/vim">Vim</option>
                        <option value="ace/keybinding/emacs">Emacs</option>
                        <option value="ace/keybinding/sublime">Sublime</option>
                        <option value="ace/keybinding/vscode">VS Code</option>
                    </select>
                </li>
                <li class="setting" placeholder="Build configuration">
                    <select required name="configuration" id="configuration">
                        <option value="" disabled selected>Build configuration</option>
                        <option value="debug">Debug</option>
                        <option value="release">Release</option>
                        <option value="pre">Preprocess</option>
                        <option value="qvms">QVMs Only</option>
                        <option value="tools">QVM Tools Only</option>
                        <option value="assets">Assets Only</option>
                        <option value="publish">Publish</option>
                        <option value="sanitize">Sanitize</option>
                        <option value="analyze">Analyze</option>
                    </select>
                </li>
                <li class="setting" style="min-width: 200px;" placeholder="Automatically reload">
                    <div style="display: flex; align-items: center;">
                        <span>Hot reload: &nbsp; </span>
                        <input type="checkbox" name="reload"
                            id="reload" checked="checked" />
                    </div>
                </li>
                <li class="engine">
                    <ul>
                        <li placeholder="Spawn point">
                            <select required name="spawn" id="spawn">
                                <option value="" selected disabled>Spawn point</option>
                            </select>
                        </li>
                        <li class="engine" placeholder="Current map">
                            <select required name="map" id="map">
                                <option value="" selected disabled>Current map</option>
                            </select>
                        </li>
                    </ul>
                </li>
                <li class="setting" placeholder="Current WASI-SDK">
                    <select required name="wasi" id="wasi">
                        <option value="" selected disabled>WASI-SDK v33 (Not downloaded)</option>
                    </select></li>
                <li class="setting" placeholder="Current theme">
                    <select required name="theme" id="theme">
                        <option value="" selected disabled>Current theme</option>
                        <optgroup label="The Classics & Defaults">
                            <option value="ace/theme/monokai" selected>Monokai (OG High Contrast)</option>
                            <option value="ace/theme/textmate">TextMate (The Standard)</option>
                            <option value="ace/theme/github">GitHub (Legacy)</option>
                            <option value="ace/theme/github_light_default">GitHub Light Default</option>
                            <option value="ace/theme/github_dark">GitHub Dark</option>
                        </optgroup>

                        <optgroup label="Cyberpunk & Retro Terminal">
                            <option value="ace/theme/terminal">Retro Terminal</option>
                            <option value="ace/theme/gob">Green on Black (The Matrix)</option>
                            <option value="ace/theme/vibrant_ink">Vibrant Ink (Neon)</option>
                            <option value="ace/theme/cobalt">Cobalt (Deep Sea Blue)</option>
                            <option value="ace/theme/chaos">Chaos (Extreme Contrast)</option>
                        </optgroup>

                        <optgroup label="Modern & Soft Darks">
                            <option value="ace/theme/dracula">Dracula (Vampire Mode)</option>
                            <option value="ace/theme/one_dark">One Dark (Atom Style)</option>
                            <option value="ace/theme/nord_dark">Nord Dark (Arctic Frost)</option>
                            <option value="ace/theme/gruvbox">Gruvbox (Earth Tones)</option>
                            <option value="ace/theme/pastel_on_dark">Pastel on Dark</option>
                            <option value="ace/theme/twilight">Twilight (Warm Dark)</option>
                            <option value="ace/theme/ambiance">Ambiance (Smooth Espresso)</option>
                        </optgroup>

                        <optgroup label="Corporate & Compliance (Bright)">
                            <option value="ace/theme/chrome">Chrome (High Visibility)</option>
                            <option value="ace/theme/eclipse">Eclipse (Java Classic)</option>
                            <option value="ace/theme/sqlserver">SQL Server</option>
                            <option value="ace/theme/xcode">XCode</option>
                            <option value="ace/theme/cloud_editor">CloudEditor Light</option>
                            <option value="ace/theme/cloud_editor_dark">CloudEditor Dark</option>
                            <option value="ace/theme/dreamweaver">Dreamweaver</option>
                        </optgroup>

                        <optgroup label="Artistic & Atmospheric">
                            <option value="ace/theme/solarized_dark">Solarized Dark</option>
                            <option value="ace/theme/solarized_light">Solarized Light</option>
                            <option value="ace/theme/katzenmilch">KatzenMilch (Warm Gray)</option>
                            <option value="ace/theme/kuroir">Kuroir (Paper White)</option>
                            <option value="ace/theme/dawn">Dawn (Soft Sunrise)</option>
                            <option value="ace/theme/clouds">Clouds</option>
                            <option value="ace/theme/clouds_midnight">Clouds Midnight</option>
                        </optgroup>

                        <optgroup label="The 'Tomorrow' Series">
                            <option value="ace/theme/tomorrow">Tomorrow</option>
                            <option value="ace/theme/tomorrow_night">Tomorrow Night</option>
                            <option value="ace/theme/tomorrow_night_blue">Tomorrow Night Blue</option>
                            <option value="ace/theme/tomorrow_night_bright">Tomorrow Night Bright</option>
                            <option value="ace/theme/tomorrow_night_eighties">Tomorrow Night 80s</option>
                        </optgroup>

                        <optgroup label="Niche & Specialist">
                            <option value="ace/theme/mono_industrial">Mono Industrial</option>
                            <option value="ace/theme/merbivore">Merbivore</option>
                            <option value="ace/theme/merbivore_soft">Merbivore Soft</option>
                            <option value="ace/theme/idle_fingers">idle Fingers</option>
                            <option value="ace/theme/kr_theme">krTheme</option>
                            <option value="ace/theme/iplastic">IPlastic</option>
                            <option value="ace/theme/crimson_editor">Crimson Editor</option>
                        </optgroup>
                    </select>
                </li>
                <li><a alt="Console" href="#terminal-container" class="bx bx-terminal"></a></li>
                <li><a alt="Edit settings" href="#settings" class="bx bx-gear"></a></li>
            </ul>
        </div>
        <div id="main-body" class="panel-row">
            <div id="tabs">
                <ul>
                    <li><a alt="Collapse" href="#collapse" class="bx bx-arrow-in-left-square-half"></a></li>
                    <li><a alt="Search files" href="#filesearch" class="bx bx-search"></a></li>
                    <li><a alt="Engine files" href="#filelist" class="active bx bx-folder-code"></a></li>
                    <li><a alt="Game files" href="#gamelist" class="bx bx-handheld-alt"></a></li>
                    <li><a alt="Assets" href="#assetlist" class="bx bx-treasure-chest"></a></li>
                    <li><a alt="Local database" href="#database" class="bx bx-database"></a></li>
                    <li><a alt="Github commit" href="#github" class="bx bx-git-repo-forked"></a></li>
                    <li><a alt="Edit settings" href="#settings" class="bx bx-gear"></a></li>
                    <li><a alt="Show engine" href="#viewport-frame" class="bx bx-play"></a></li>
                    <li><a alt="Show console" href="#terminal-container" class="bx bx-terminal"></a></li>
                </ul>
            </div>
            <div id="editor-container" class="panel-row">
                <div id="filesearch" class="hidden">

                </div>
                <div id="filelist" data-repository="briancullinan2/Quake3e">

                </div>
                <div id="gamelist" data-repository="ec-/baseq3a" class="hidden">

                </div>
                <div id="assetlist" class="hidden">

                </div>
                <div id="database" class="hidden">

                </div>
                <div id="github" class="hidden">

                </div>
<div id="editor">
#include <stdio.h>

int main() {
    printf("Hello World!\n");
    printf("WASI Compiler Check: SUCCESS\n");
    return 0;
}

</div>
            </div>
            <div id="viewport-frame">
                <div id="dialog">
                    <h4 class="title"></h4>
                    <p class="description"></p>
                </div>
                <div id="flipper">
                    <div class="front">
                        <!-- front content -->
                    </div>
                    <div class="back">
                        <!-- back content -->
                    </div>
                </div>
                <div id="left-joystick"></div>
                <div id="right-joystick"></div>
                <canvas></canvas>
            </div>
            <canvas id="scratch"></canvas>
        </div>
        <div id="terminal-container" class="panel-column">
            <div id="terminals">
                <ul>
                    <li><a class="active" href="#all">All</a></li>
                    <li><a href="#error">Error</a></li>
                    <li><a href="#warn">Warn</a></li>
                    <li><a href="#info">Info</a></li>
                    <li><a href="#soft">CLI Render</a></li>
                    <li><a href="#immediate">Immediate</a></li>
                    <li><a href="#build">Build</a></li>
                    <li><a href="#terminal-container">Console</a></li>
                    <li><a href="#ai">AI Integration</a></li>
                    <li style="flex-grow: 1;"><span>&nbsp;</span></li>
                    <li placeholder="Search..."><input autocomplete="off" type="search" id="search-terminal" name="search-terminal"
                            placeholder="Search..." /></li>
                </ul>
            </div>
            <div id="terminal">

            </div>
        </div>
        <div id="statusbar">
            <span>Status: </span>
            <span>No engine</span>
        </div>
    </div>

    <div id="token-modal" class="hidden">
        <div class="modal-content">
            <form onsubmit="saveToken()" action="#">
                <button class="close-btn" onclick="modal.classList.add('hidden')">&times;</button>
                <h3>GitHub Access Token</h3>
                <p>Required for API access</p>
                <div placeholder="Enter ghp your token here...">
                    <input placeholder="Enter ghp your token here..." type="password" id="gh-token-input"
                        name="gh-token-input" />
                </div>
                <div class="actions">
                    <button onclick="saveToken()">Save Token</button>
                    <button onclick="clearToken()" class="danger">Clear</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/jszip.min.js" type="text/javascript" defer></script>
    <script src="/ace/ace.js" type="text/javascript" charset="utf-8" defer></script>
    <script src="/editor.js" type="text/javascript" defer></script>
    <script src="/local.js" type="text/javascript" defer></script>
    <script src="/github.js" type="text/javascript" defer></script>
    <script src="/xterm.js" type="text/javascript" defer></script>
    <script src="/terminal.js" type="text/javascript" defer></script>
    <script src="/tree.js" type="text/javascript" defer></script>
    <script src="/make.js" type="text/javascript" defer></script>
    <script src="/make-tools.js" type="text/javascript" defer></script>
    <script src="/make-qvm.js" type="text/javascript" defer></script>
    <script src="/toolbar.js" type="text/javascript" defer></script>
    <script src="/filelist.js" type="text/javascript" defer></script>
    <script src="/compiler.js" type="text/javascript" defer></script>
    <script src="/unzip.js" type="text/javascript" defer></script>
    <script src="/commands.js" type="text/javascript" defer></script>
    <script src="/shared.js" type="text/javascript" defer></script>

    <script defer type="text/javascript" src="nipplejs.js"></script>
    <script defer type="text/javascript" src="sys_emgl.js"></script>
    <script defer type="text/javascript" src="sys_fs.js"></script>
    <script defer type="text/javascript" src="sys_in.js"></script>
    <script defer type="text/javascript" src="sys_net.js"></script>
    <script defer type="text/javascript" src="sys_std.js"></script>
    <script defer type="text/javascript" src="sys_web.js"></script>
    <script defer type="text/javascript" src="sys_snd.js"></script>
    <script defer type="text/javascript" src="sys_wasm.js"></script>

</body>

</html>
